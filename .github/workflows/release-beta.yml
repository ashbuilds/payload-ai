name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Verify release tag matches package version
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const tag = process.env.RELEASE_REF_NAME;
            if (process.env.RELEASE_REF_TYPE !== "tag" || tag.replace(/^v/, "") !== version) {
              throw new Error("Publish requires a tag matching package.json version " + version);
            }
          '

      - name: Ensure npm version supports Trusted Publishing
        run: npm i -g npm@11

      - name: Install pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b  # v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test:int

      - name: Build
        run: pnpm build

      - name: Select npm tag
        id: tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ "$TAG" == *beta* ]]; then
            echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (Trusted Publishing)
        run: npm publish --tag ${{ steps.tag.outputs.npm_tag }} --access public
